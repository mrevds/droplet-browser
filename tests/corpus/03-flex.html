<!DOCTYPE html>
<!-- EXPECT: row of three 100px boxes with 10px gaps, centered horizontally; below, a column of two boxes; third row: space-between pushes A to the left edge and B to the right edge. -->
<html><head><meta charset="utf-8"><title>Flex</title>
<style>
.row { display: flex; justify-content: center; gap: 10px }
.col { display: flex; flex-direction: column; width: 200px }
.sb { display: flex; justify-content: space-between }
.i { width: 100px; height: 40px; background: #4a90d9 }
</style></head><body>
<div class="row"><div class="i">1</div><div class="i">2</div><div class="i">3</div></div>
<div class="col"><div class="i">A</div><div class="i">B</div></div>
<div class="sb"><div class="i">A</div><div class="i">B</div></div>
</body></html>
