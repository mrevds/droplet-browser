<!DOCTYPE html>
<!-- EXPECT: the 120x80 box floats left and the paragraph text wraps around its right side; .clear starts below the float. -->
<html><head><meta charset="utf-8"><title>Float</title>
<style>.f { float: left; width: 120px; height: 80px; background: #89c; margin-right: 8px } .clear { clear: both; border-top: 2px solid #000 }</style>
</head><body>
<div class="f"></div>
<p>Текст обтекает плавающий блок справа. Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
<div class="clear">Below the float</div>
</body></html>
