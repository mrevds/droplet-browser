[package]
name = "droplet-desktop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "droplet"
path = "src/main.rs"

[dependencies]
droplet-url = { path = "../../crates/droplet-url" }
droplet-net = { path = "../../crates/droplet-net" }
droplet-dom = { path = "../../crates/droplet-dom" }
droplet-style = { path = "../../crates/droplet-style" }
droplet-gfx = { path = "../../crates/droplet-gfx" }
droplet-image = { path = "../../crates/droplet-image" }
droplet-font = { path = "../../crates/droplet-font" }
droplet-layout = { path = "../../crates/droplet-layout" }
droplet-paint = { path = "../../crates/droplet-paint" }
droplet-platform = { path = "../../crates/droplet-platform" }
droplet-shell = { path = "../../crates/droplet-shell" }
droplet-ipc = { path = "../../crates/droplet-ipc", optional = true }
droplet-sandbox = { path = "../../crates/droplet-sandbox", optional = true }

[features]
default = []
# Experimental multi-process renderer: `--renderer`, `--sandbox-screenshot` (ROADMAP Phase 8).
sandbox = ["dep:droplet-ipc", "dep:droplet-sandbox"]

[[test]]
name = "sandbox_renderer"
required-features = ["sandbox"]
